name: Test & Publish NuGet package

on:
  push:
    branches:
      - master
      - develop
    
env:
  OutputDirectory: ${{ github.workspace}}/output


jobs:
  run-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'
      
      - name: Run tests - net9.0
        run: dotnet test -f net9.0 -c Release -v quiet

      - name: Pack NuGet package
        run: dotnet pack --configuration Release --output ${{ env.OutputDirectory }}
        
      - name: Publish NuGet package
        run: |
          foreach($file in (Get-ChildItem "${{ env.OutputDirectory }}" -Recurse -Include *.nupkg)) {
              dotnet nuget push $file --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
    
